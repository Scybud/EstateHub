<div class="modal-container">
  <form class="create-org" id="addTenantForm">
    <h2 style="margin-bottom: var(--space-xl);">Add Tenant</h2>
    <button type="button" class="closeModalBtn" onclick="document.getElementById('modalContainer').innerHTML=''">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="3.5" width="17" height="17" rx="6" ry="6" fill="currentColor" opacity="0.06" />
        <path d="M9 9l6 6M15 9l-6 6" />
      </svg>
    </button>

    <label for="tenant-name">Tenant Name
      <input type="text" id="tenant-name" placeholder="John Mike" required>
    </label>

    <label for="tenant-phone">Phone
      <input type="tel" id="tenant-phone" placeholder="+234 56789123" required>
    </label>

    <label for="tenant-rent">Rent (₦)
      <input type="number" id="tenant-rent" placeholder="Amount" step="0.01" required>
    </label>

    <div class="form-group-row">
      <label>Lease Start
        <input type="date" id="tenant-lease-start" required>
      </label>
      <label>Lease End
        <input type="date" id="tenant-lease-end" required>
      </label>
    </div>

    <button type="submit" class="btn submit-btn">Add Tenant</button>
  </form>
</div>
